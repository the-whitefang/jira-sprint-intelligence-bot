[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# No sqlalchemy.url here, deliberately — env.py reads the connection
# string from the application's own Settings (app/core/config.py) at
# runtime, so there is exactly one source of truth for it, matching the
# rest of the codebase's configuration philosophy.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
